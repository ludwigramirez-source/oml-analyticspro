version: '3.9'

services:
  # Backend Service
  backend:
    build:
      context: .
      dockerfile: ./compose/dev/backend/backend.dev.dockerfile
    container_name: oml-backend-dev
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DB_NAME=${DB_NAME:-omnileads_analytics}
      - OMNILEADS_DB_HOST=${OMNILEADS_DB_HOST:-postgres-omnileads}
      - OMNILEADS_DB_PORT=${OMNILEADS_DB_PORT:-5432}
      - OMNILEADS_DB_USER=${OMNILEADS_DB_USER:-postgres}
      - OMNILEADS_DB_PASSWORD=${OMNILEADS_DB_PASSWORD:-postgres}
      - OMNILEADS_DB_NAME=${OMNILEADS_DB_NAME:-omnileads}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-dev-secret-key-change-in-production}
      - LOG_LEVEL=${LOG_LEVEL:-DEBUG}
      - TIMEZONE_DB=${TIMEZONE_DB:-America/Bogota}
      # Local DB (sync) — puerto interno 5432 en Docker network
      - USE_LOCAL_DB=${USE_LOCAL_DB:-true}
      - LOCAL_DB_HOST=postgres-local
      - LOCAL_DB_PORT=5432
      - LOCAL_DB_NAME=${LOCAL_DB_NAME:-omnileads_local}
      - LOCAL_DB_USER=${LOCAL_DB_USER:-analytics}
      - LOCAL_DB_PASSWORD=${LOCAL_DB_PASSWORD:-analytics_password}
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      - postgres-omnileads
      - postgres-local
    networks:
      - oml-network
    restart: unless-stopped
    command: uvicorn server:app --host 0.0.0.0 --port 8000 --reload

  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: ./compose/dev/frontend/frontend.dev.dockerfile
    container_name: oml-frontend-dev
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000/api}
      - REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL:-http://localhost:8000}
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - oml-network
    restart: unless-stopped

  # PostgreSQL Service (OmniLeads Database)
  postgres-omnileads:
    image: postgres:16-alpine
    container_name: oml-postgres-omnileads-dev
    ports:
      - "${OMNILEADS_DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_USER=${OMNILEADS_DB_USER:-postgres}
      - POSTGRES_PASSWORD=${OMNILEADS_DB_PASSWORD:-postgres}
      - POSTGRES_DB=${OMNILEADS_DB_NAME:-omnileads}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8
    volumes:
      - postgres-omnileads-data:/var/lib/postgresql/data
    networks:
      - oml-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${OMNILEADS_DB_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Local (replica sincronizada)
  postgres-local:
    image: postgres:16-alpine
    container_name: oml-postgres-local-dev
    ports:
      - "${LOCAL_DB_PORT:-5433}:5432"
    environment:
      - POSTGRES_USER=${LOCAL_DB_USER:-analytics}
      - POSTGRES_PASSWORD=${LOCAL_DB_PASSWORD:-analytics_password}
      - POSTGRES_DB=${LOCAL_DB_NAME:-omnileads_local}
      - POSTGRES_INITDB_ARGS=--encoding=UTF8
      - TZ=${TIMEZONE_DB:-America/Bogota}
      - PGTZ=${TIMEZONE_DB:-America/Bogota}
    volumes:
      - postgres-local-data:/var/lib/postgresql/data
    command: >
      postgres
      -c timezone=${TIMEZONE_DB:-America/Bogota}
      -c log_timezone=${TIMEZONE_DB:-America/Bogota}
    networks:
      - oml-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${LOCAL_DB_USER:-analytics}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Sync Service (sincroniza OmniLeads remoto → BD local)
  sync-service:
    build:
      context: .
      dockerfile: ./compose/dev/sync/sync.dev.dockerfile
    container_name: oml-sync-service-dev
    environment:
      - PYTHONUNBUFFERED=1
      # Source DB (OmniLeads remota)
      - OMNILEADS_DB_HOST=${OMNILEADS_DB_HOST:-postgres-omnileads}
      - OMNILEADS_DB_PORT=${OMNILEADS_DB_PORT:-5432}
      - OMNILEADS_DB_USER=${OMNILEADS_DB_USER:-postgres}
      - OMNILEADS_DB_PASSWORD=${OMNILEADS_DB_PASSWORD:-postgres}
      - OMNILEADS_DB_NAME=${OMNILEADS_DB_NAME:-omnileads}
      # Local DB — puerto interno 5432 en Docker network
      - LOCAL_DB_HOST=postgres-local
      - LOCAL_DB_PORT=5432
      - LOCAL_DB_NAME=${LOCAL_DB_NAME:-omnileads_local}
      - LOCAL_DB_USER=${LOCAL_DB_USER:-analytics}
      - LOCAL_DB_PASSWORD=${LOCAL_DB_PASSWORD:-analytics_password}
      # Sync config
      - SYNC_INTERVAL_EVENT_LOGS=${SYNC_INTERVAL_EVENT_LOGS:-300}
      - SYNC_INTERVAL_REFERENCE=${SYNC_INTERVAL_REFERENCE:-3600}
      - SYNC_BATCH_SIZE=${SYNC_BATCH_SIZE:-10000}
      - SYNC_INITIAL_BATCH_SIZE=${SYNC_INITIAL_BATCH_SIZE:-50000}
    volumes:
      - ./backend:/app
      - /app/__pycache__
    depends_on:
      postgres-local:
        condition: service_healthy
    networks:
      - oml-network
    restart: unless-stopped

  # pgAdmin for database management (development only)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: oml-pgadmin-dev
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - postgres-omnileads
    networks:
      - oml-network
    restart: unless-stopped

networks:
  oml-network:
    driver: bridge

volumes:
  postgres-omnileads-data:
  postgres-local-data:
  pgadmin-data:
