version: '3.9'

services:
  # Backend Service
  backend:
    build:
      context: .
      dockerfile: ./compose/prod/backend/backend.prod.dockerfile
    container_name: oml-backend-prod
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DB_NAME=${DB_NAME}
      - OMNILEADS_DB_HOST=${OMNILEADS_DB_HOST}
      - OMNILEADS_DB_PORT=${OMNILEADS_DB_PORT}
      - OMNILEADS_DB_USER=${OMNILEADS_DB_USER}
      - OMNILEADS_DB_PASSWORD=${OMNILEADS_DB_PASSWORD}
      - OMNILEADS_DB_NAME=${OMNILEADS_DB_NAME}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: always
    networks:
      - oml-network
    depends_on:
      postgres-omnileads:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: ./compose/prod/frontend/frontend.prod.dockerfile
    container_name: oml-frontend-prod
    expose:
      - "80"
    environment:
      - NODE_ENV=production
    networks:
      - oml-network
    depends_on:
      - backend
    restart: always
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: oml-nginx-prod
    ports:
      - "${NGINX_PORT:-80}:80"
      - "${NGINX_SSL_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./prod/nginx-prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./prod/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    networks:
      - oml-network
    restart: always
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

networks:
  oml-network:
    driver: bridge
