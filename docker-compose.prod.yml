version: '3.9'

services:
  # Backend Service
  backend:
    build:
      context: .
      dockerfile: ./compose/prod/backend/backend.prod.dockerfile
    expose:
      - "8000"
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DB_NAME=${DB_NAME}
      - OMNILEADS_DB_HOST=${OMNILEADS_DB_HOST}
      - OMNILEADS_DB_PORT=${OMNILEADS_DB_PORT}
      - OMNILEADS_DB_USER=${OMNILEADS_DB_USER}
      - OMNILEADS_DB_PASSWORD=${OMNILEADS_DB_PASSWORD}
      - OMNILEADS_DB_NAME=${OMNILEADS_DB_NAME}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: always
    networks:
      - oml-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/api/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Frontend Service
  frontend:
    build:
      context: .
      dockerfile: ./compose/prod/frontend/frontend.prod.dockerfile
    container_name: oml-frontend-prod
    # expose:
    #   - "80"
    ports:
      - "${NGINX_PORT:-80}:80"
      # - "${NGINX_SSL_PORT:-443}:443"
    environment:
      - NODE_ENV=production
      - REACT_APP_BACKEND_URL=${REACT_APP_BACKEND_URL:-localhost:81}
    networks:
      - oml-network
    depends_on:
      - backend
    restart: always
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    volumes:
      - /app/node_modules

networks:
  oml-network:
    driver: bridge
